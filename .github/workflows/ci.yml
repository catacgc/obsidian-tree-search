name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo target directory
        uses: actions/cache@v4
        with:
          path: packages/parser-native/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/parser-native/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        working-directory: packages/parser-native
        run: wasm-pack build --target web --out-dir pkg

      - name: Run Rust tests
        working-directory: packages/parser-native
        run: cargo test

      - name: Check WASM compressed size
        run: |
          gzip -c packages/parser-native/pkg/parser_native_bg.wasm > /tmp/parser_native_bg.wasm.gz
          SIZE=$(stat --format=%s /tmp/parser_native_bg.wasm.gz)
          echo "Compressed WASM size: $SIZE bytes"
          if [ "$SIZE" -gt 2097152 ]; then
            echo "ERROR: Compressed WASM size ($SIZE bytes) exceeds 2 MB limit (2097152 bytes)"
            exit 1
          fi
          echo "OK: Compressed WASM size is within the 2 MB limit"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run TypeScript tests
        run: bun test

      - name: Production build
        run: npm run build --if-present

      - name: Verify build output
        run: ls -la dist/main.js
